# =====================================================================
#  Nginx: recibe las peticiones de internet (puerto 80/443) y se las pasa
#  a Gunicorn (127.0.0.1:8000). Gunicorn NUNCA queda expuesto directo.
#
#  Instalar:
#    sudo cp deploy/aws/nginx-biblioteca.conf /etc/nginx/sites-available/biblioteca
#    sudo ln -s /etc/nginx/sites-available/biblioteca /etc/nginx/sites-enabled/
#    sudo rm -f /etc/nginx/sites-enabled/default
#    sudo nginx -t && sudo systemctl reload nginx
#
#  HTTPS (necesitas un dominio apuntando a la Elastic IP):
#    sudo apt install -y certbot python3-certbot-nginx
#    sudo certbot --nginx -d api.tudominio.cl
#  certbot agrega solo el bloque 443 y la redirección desde http.
# =====================================================================
server {
    listen 80;
    server_name _;                      # cámbialo por api.tudominio.cl cuando tengas dominio

    client_max_body_size 1m;            # la API solo recibe JSON chicos

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
